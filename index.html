<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SfcJs</title>
<style>
  body {
    background: #000000;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  #screen {
    background: #000;
    image-rendering: pixelated;
    width: 512px;
    height: 480px;
    border: 1px solid #fff;
  }
  #bar {
    margin: 10px 0;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #log {
    width: 768px;
    height: 100px;
    overflow-y: auto;
    background: #111;
    border: 1px solid #444;
    font-size: 12px;
    padding: 6px;
    white-space: pre-wrap;
    font-family: monospace;
  }
  button { cursor: pointer; }
  #help {
    width: 768px;
    font-size: 12px;
    color: #aaa;
    margin-top: 8px;
  }
  img{
    image-rendering: pixelated;
    width:500px;
  }
</style>
</head>
<body>

<img src="NANDSP.png">
<div id="bar">
  <input type="file" id="romInput" accept=".sfc,.smc,.bin">
  <label><input type="checkbox" id="hiromCheck"> Force HiROM</label>
  <button id="pauseBtn" disabled>Pause</button>
  <button id="muteBtn">Mute</button>
</div>

<canvas id="screen" width="512" height="480"></canvas>
<div style="display:none">
<div id="help">
  操作方法: 十字キー = 矢印キー / A = X / B = Z / X = S / Y = A / L = Q / R = W / Start = Enter / Select = Shift
</div>

<div id="log"></div>
</div>
<!-- Core emulator files -->
<script src="cart.js"></script>
<script src="cpu.js"></script>
<script src="pipu.js"></script>
<script src="spc.js"></script>
<script src="apu.js"></script>
<script src="snes.js"></script>

<script>
// ---------------------------------------------------------------------------
// Utility functions expected by the core files but not defined anywhere in
// them (log/clearArray/getByteRep/getWordRep/getLongRep).
// ---------------------------------------------------------------------------
const logEl = document.getElementById('log');
function log(msg) {
  console.log(msg);
  if (logEl) {
    logEl.textContent += msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }
}
function clearArray(arr) { arr.fill(0); }
function getByteRep(v) { return (v & 0xff).toString(16).padStart(2, '0'); }
function getWordRep(v) { return (v & 0xffff).toString(16).padStart(4, '0'); }
function getLongRep(v) { return (v & 0xffffff).toString(16).padStart(6, '0'); }

// ---------------------------------------------------------------------------
// Snes instance + canvas setup
// ---------------------------------------------------------------------------
const snes = new Snes();

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const frameImage = ctx.createImageData(512, 480);
// pre-fill alpha so the whole buffer is opaque even before the first frame
for (let i = 3; i < frameImage.data.length; i += 4) frameImage.data[i] = 255;

let running = false;
let paused = false;
let romLoaded = false;

// ---------------------------------------------------------------------------
// Audio: ScriptProcessorNode pulling samples straight from the Snes/Apu.
// ---------------------------------------------------------------------------
let audioCtx = null;
let scriptNode = null;
let muted = false;

function setupAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // bufferSize 2048 @ audioCtx.sampleRate; Apu.setSamples fills exactly this many
  scriptNode = audioCtx.createScriptProcessor(2048, 0, 2);
  scriptNode.onaudioprocess = function(e) {
    const outL = e.outputBuffer.getChannelData(0);
    const outR = e.outputBuffer.getChannelData(1);
    if (!running || paused || muted || !romLoaded) {
      outL.fill(0);
      outR.fill(0);
      return;
    }
    snes.setSamples(outL, outR, outL.length);
  };
  scriptNode.connect(audioCtx.destination);
}

// ---------------------------------------------------------------------------
// Rom loading
// ---------------------------------------------------------------------------
const romInput = document.getElementById('romInput');
const hiromCheck = document.getElementById('hiromCheck');
const pauseBtn = document.getElementById('pauseBtn');
const muteBtn = document.getElementById('muteBtn');

romInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    const rom = new Uint8Array(reader.result);
    const isHirom = hiromCheck.checked;
    const ok = snes.loadRom(rom, isHirom);
    if (!ok) {
      log("Failed to load rom.");
      return;
    }
    snes.reset(true);
    romLoaded = true;
    paused = false;
    pauseBtn.disabled = false;
    pauseBtn.textContent = "Pause";
    setupAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (!running) {
      running = true;
      requestAnimationFrame(frameLoop);
    }
  };
  reader.readAsArrayBuffer(file);
});

pauseBtn.addEventListener('click', function() {
  if (!romLoaded) return;
  paused = !paused;
  pauseBtn.textContent = paused ? "Resume" : "Pause";
});

muteBtn.addEventListener('click', function() {
  muted = !muted;
  muteBtn.textContent = muted ? "Unmute" : "Mute";
  if (!muted && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});

// ---------------------------------------------------------------------------
// Main loop: one Snes frame per rAF, then blit the framebuffer to canvas.
// ---------------------------------------------------------------------------
function frameLoop() {
  if (!running) return;
  if (romLoaded && !paused) {
    try {
      snes.runFrame(false);
      snes.setPixels(frameImage.data);
      ctx.putImageData(frameImage, 0, 0);
    } catch (err) {
      log("Emulation error: " + err.message);
      console.error(err);
      paused = true;
      pauseBtn.textContent = "Resume";
    }
  }
  requestAnimationFrame(frameLoop);
}

// ---------------------------------------------------------------------------
// Keyboard input -> joypad 1
// Bit numbers follow the standard SNES auto-joypad-read report order:
// 0:B 1:Y 2:Select 3:Start 4:Up 5:Down 6:Left 7:Right 8:A 9:X 10:L 11:R
// ---------------------------------------------------------------------------
const keyMap = {
  "ArrowUp": 4,
  "ArrowDown": 5,
  "ArrowLeft": 6,
  "ArrowRight": 7,
  "KeyX": 8,      // A button
  "KeyZ": 0,      // B button
  "KeyS": 9,      // X button
  "KeyA": 1,      // Y button
  "KeyQ": 10,     // L
  "KeyW": 11,     // R
  "Enter": 3,     // Start
  "ShiftLeft": 2, // Select
  "ShiftRight": 2
};

window.addEventListener('keydown', function(e) {
  const bit = keyMap[e.code];
  if (bit !== undefined) {
    snes.setPad1ButtonPressed(bit);
    e.preventDefault();
  }
});
window.addEventListener('keyup', function(e) {
  const bit = keyMap[e.code];
  if (bit !== undefined) {
    snes.setPad1ButtonReleased(bit);
    e.preventDefault();
  }
});

log("Ready. ROMファイル (.sfc/.smc) を選択してください。");
</script>
</body>
</html>
